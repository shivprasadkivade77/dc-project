[project]
name = "holo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shivprasadkivade77", email = "shivprasadkivade77@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "joblib>=1.5.3",
    "librosa>=0.11.0",
    "numpy>=2.0.2",
    "pynput>=1.8.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.6.1",
    "sounddevice>=0.5.6",
]

[project.scripts]
holo = "holo:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
