project:
  name: "AcousticTap-Holo"
  version: "3.0.0-hybrid-fourier-ultrasonic"

audio:
  sample_rate: 48000
  block_size: 512
  pre_blocks: 6
  post_blocks: 10
  cooldown_blocks: 25
  rms_threshold: 0.004
  dynamic_multiplier: 2.0
  lowpass_cutoff_hz: 16000.0

ultrasonic:
  enabled: true
  left_freq_hz: 19000.0
  right_freq_hz: 20200.0
  speaker_amplitude: 0.03
  carrier_bw_hz: 25.0
  doppler_min_hz: 25.0
  doppler_max_hz: 180.0
  alpha_doppler: 0.65
  gate_threshold: 2.0
  gate_steepness: 2.5
  calibration_blocks: 35

classes:
  - "left_tap"
  - "right_tap"
  - "noise"

fusion:
  fourier_weight: 0.50
  auto_tune_weight: true
  ultrasonic_2fa_enabled: true

features:
  default_set: "all"
  n_mfcc: 13

models:
  random_state: 42
  cv_folds: 5
  test_size: 0.20

listener:
  confidence_threshold: 0.58
  snr_gate_db: 6.0
  enable_shortcuts: false
